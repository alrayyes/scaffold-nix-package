# Deliberately ungated: a secret can be committed to any file, so there's no
# diff this is safe to skip for — no `paths:` filter.
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    container:
      # Pinned by digest like any other image. The version tag in the
      # comment is what `docker run zricethezav/gitleaks@<digest> version`
      # actually reports.
      image: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
      # The image's own ENTRYPOINT is the gitleaks binary itself, which
      # would swallow the runner's exec of each step; clear it so `run:`
      # steps go through the image's shell instead.
      options: --entrypoint ""
    timeout-minutes: 10
    steps:
      # fetch-depth: 0, or there's no history to walk and the job passes
      # having scanned nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Scoped to branches and tags rather than every ref: GitHub keeps a
      # permanent refs/pull/<n>/head per pull request, which a rewritten
      # history would still leave pointing at pre-rewrite commits.
      - run: gitleaks git --redact --no-banner --log-opts="--branches --tags" .
