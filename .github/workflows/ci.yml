# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs more says so itself.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Proves the packaging itself, not just the linters around it: evaluates
  # every flake output for the runner's system and builds the derivation the
  # template actually ships.
  #
  # Runs on the bare runner via cachix/install-nix-action rather than inside
  # a nixos/nix container: GitHub Actions bind-mounts its own Node runtime
  # into a job's container to run JS-based actions like actions/checkout, and
  # that Node binary needs an FHS-standard dynamic linker path
  # (/lib64/ld-linux-x86-64.so.2) that a NixOS-style image deliberately
  # doesn't have — confirmed live, `actions/checkout` itself failed with
  # `exec /__e/node24/bin/node: no such file or directory` before this
  # switched away from the container. install-nix-action sidesteps the whole
  # problem by installing Nix onto the runner's own Ubuntu filesystem
  # instead, which is why it's used here over the container-pinning
  # discipline the rest of this repo's images follow — it's still pinned to
  # a full commit SHA, same as any other action.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix flake check
        run: nix flake check
      - name: nix build
        run: nix build .#example -L
      - name: smoke test
        run: ./result/bin/example

  lint-nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: statix
        run: nix run nixpkgs#statix -- check .
      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail .
      - name: nixpkgs-fmt --check
        # The pre-commit hook's fixer's twin: re-run the formatter in
        # check-only mode rather than rewriting anything here.
        run: nix run nixpkgs#nixpkgs-fmt -- --check .

  # Layout and structure of everything Markdown/YAML this repo owns.
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        # Frozen, so a drifted lockfile fails the job rather than silently
        # resolving to something nobody committed.
        run: bun install --frozen-lockfile
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # A hook is something you can skip, and the version number depends on
  # these messages being right, so the whole branch is checked here too.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
