# Nobody picks a version. release-please reads the Conventional Commits that
# land on main and keeps a release pull request open carrying the next
# version and the changelog entry; merging that pull request tags the
# release and writes the notes. The artefacts job then builds the package
# with Nix and hangs the archive on the release already sitting there.
#
# One workflow rather than two, because a tag pushed with GITHUB_TOKEN starts
# no further workflow run — GitHub refuses, to stop recursive runs. A
# separate on-tag workflow would silently never fire, and the first symptom
# is a release with nothing attached to it.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never two releases at once, and never cancel one halfway: a killed run can
# leave a tag pushed and nothing published against it.
concurrency:
  group: release
  cancel-in-progress: false

env:
  NIX_CONFIG: "experimental-features = nix-command flakes"

jobs:
  # Works out what, if anything, is being released. Most runs only refresh
  # the release pull request; the run that matters is the one where that
  # pull request was what just landed.
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # tags the release and writes it
      pull-requests: write # keeps the release pull request up to date
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artefacts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    container:
      image: nixos/nix@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c # 2.35.2
    permissions:
      contents: write # uploads the archive to the release
      id-token: write # mints the Sigstore OIDC token the attestation is signed with
      attestations: write # publishes the attestation to the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag, not the branch: this is the commit release-please just
          # tagged, and the derivation is built from exactly that.
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: nix build
        run: nix build .#example -L

      # Only x86_64-linux: GitHub-hosted runners are amd64, so this is the
      # one system CI ever builds a release archive for. aarch64-linux
      # stays a supported *build* target — someone on that architecture
      # builds it themselves the same way CI does — just not one this
      # workflow cross-builds and publishes.
      - name: package archive
        run: |
          mkdir -p dist
          tar -C result -czf "dist/example-${{ needs.release-please.outputs.tag_name }}-x86_64-linux.tar.gz" .

      # SLSA Build L2: a signed, Sigstore-backed attestation tying this
      # exact archive to this workflow run. Provenance, not signing — the
      # archive itself isn't cosign-signed, a separate decision left for
      # whenever a real consumer verifies one.
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz"

      - name: upload to release
        run: nix run nixpkgs#gh -- release upload "$TAG" dist/*.tar.gz
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
